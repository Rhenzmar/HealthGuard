name: HealthGuard actual-browser prototype end-to-end tests
on:
  push:
    branches: [main]
    paths:
      - 'frontend/e2e/**'
      - 'frontend/playwright.config.mjs'
      - 'frontend/src/CountermeasureGame.jsx'
      - 'frontend/src/countermeasureLogic.js'
      - 'frontend/src/countermeasureGame.css'
      - 'frontend/src/CrewCheckinGame.jsx'
      - 'frontend/src/checkinGameLogic.js'
      - 'frontend/src/crewCheckinGame.css'
      - 'frontend/src/WellnessGame.jsx'
      - 'frontend/src/wellnessGameLogic.js'
      - 'frontend/src/wellnessGame.css'
      - 'frontend/src/MissionGame.jsx'
      - 'frontend/src/missionGame.css'
      - 'frontend/src/App.jsx'
      - 'frontend/src/MissionDashboardV2.jsx'
      - 'frontend/src/ScenarioPickerModal.jsx'
      - 'frontend/src/ScenarioConsole.jsx'
      - 'frontend/src/api.js'
      - 'physiograph/live_api.py'
      - 'physiograph/scenario_engine.py'
      - '.github/workflows/prototype-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: healthguard-browser-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install numpy model/API and browser test dependencies
        run: |
          python -m pip install -r requirements-live-lite.txt httpx
          cd frontend
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @playwright/test
          npx playwright install --with-deps chromium
      - name: Test and build production frontend before browser audit
        working-directory: frontend
        run: npm run build
      - name: Test actual browser navigation and scenario interaction
        working-directory: frontend
        env:
          CI: '1'
        run: npx playwright test --config=playwright.config.mjs
      - name: Archive browser JSON, screenshots, video, traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthguard-e2e-chromium-browser-evidence
          path: |
            frontend/e2e-results/
            frontend/test-results/
          retention-days: 30
