name: Train 17-Channel Candidate
on:
  push:
    branches: [main]
    paths:
      - 'physiograph/candidate_17ch.py'
      - 'tools/train_17ch_candidate.py'
      - 'tools/export_17ch_numpy.py'
      - 'tools/evaluate_17ch_runtime.py'
      - 'physiograph/candidate_17ch_numpy.py'
      - 'tools/generate_17ch_dataset.py'
      - 'tests/test_candidate_17ch.py'
      - 'tests/test_17ch_dataset.py'
      - 'data/synthetic_17ch/biomarker_schema.json'
      - '.github/workflows/train-17ch-candidate.yml'
  workflow_dispatch:
concurrency:
  group: healthguard-17ch-candidate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  candidate-training:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install torch CPU and scientific requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<3' pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify generated data and model architecture
        run: python -m pytest -q tests/test_17ch_dataset.py tests/test_candidate_17ch.py
      - name: Train and calibrate candidate on disjoint synthetic subjects
        run: python -m tools.train_17ch_candidate
      - name: Export NumPy inference and verify Torch parity
        run: python -m tools.export_17ch_numpy
      - name: Assess normal replay false flags across four simulated crew profiles
        run: python -m tools.evaluate_17ch_runtime
      - name: Preserve checkpoint, evaluation, dataset provenance
        uses: actions/upload-artifact@v4
        with:
          name: healthguard-17ch-candidate
          path: |
            models/deep_learning/candidate_17ch/
            models/deep_learning/candidate_17ch/generated/dataset_report.json
            models/deep_learning/candidate_17ch/generated/split_manifest.json
            models/deep_learning/candidate_17ch/generated/provenance.json
          retention-days: 30
      - name: Publish only source-matching candidate files
        run: |
          mkdir -p /tmp/hg17-publish
          cp models/deep_learning/candidate_17ch/model.pt /tmp/hg17-publish/
          cp models/deep_learning/candidate_17ch/evaluation.json /tmp/hg17-publish/
          cp models/deep_learning/candidate_17ch/model_numpy.npz /tmp/hg17-publish/
          cp models/deep_learning/candidate_17ch/numpy_parity_report.json /tmp/hg17-publish/
          cp models/deep_learning/candidate_17ch/runtime_compatibility_report.json /tmp/hg17-publish/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            for src in tools/generate_17ch_dataset.py tools/train_17ch_candidate.py tools/export_17ch_numpy.py tools/evaluate_17ch_runtime.py physiograph/candidate_17ch.py physiograph/candidate_17ch_numpy.py data/synthetic_17ch/biomarker_schema.json; do
              if [ "$(git rev-parse "$GITHUB_SHA:$src")" != "$(git rev-parse "origin/main:$src")" ]; then
                echo "A newer source revision exists; skip publishing stale candidate artifacts."
                exit 0
              fi
            done
            git reset --hard origin/main
            cp /tmp/hg17-publish/* models/deep_learning/candidate_17ch/
            git add models/deep_learning/candidate_17ch/model.pt models/deep_learning/candidate_17ch/evaluation.json models/deep_learning/candidate_17ch/model_numpy.npz models/deep_learning/candidate_17ch/numpy_parity_report.json models/deep_learning/candidate_17ch/runtime_compatibility_report.json
            if git diff --staged --quiet; then
              echo "Candidate artifacts are already up to date."
              exit 0
            fi
            git commit -m "Store source-matched 17-channel candidate and replay evaluation"
            if git push origin HEAD:main; then
              echo "Published verified candidate"
              exit 0
            fi
            echo "Concurrent update; rebuilding commit from latest main"
          done
          echo "Could not safely publish candidate after five attempts"
          exit 1
