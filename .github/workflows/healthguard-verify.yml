name: HealthGuard Verification
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-live-lite.txt pytest httpx pandas
      - name: Verify source provenance and physiological and engineering APIs
        env:
          PHYSIOGRAPH_INFERENCE_BACKEND: numpy
          PHYSIOGRAPH_AUTO_DEMO: "0"
        run: |
          python -m pytest -q tests/test_v10_live_telemetry.py tests/test_v15_research_api.py tests/test_engineering_sim.py tests/test_candidate17_runtime.py tests/test_physioalert_unified.py tests/test_biomarker_detection.py tests/test_v15_backend_freeze.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
